
server:
  port: ${PORT:9630}

spring:
  application:
    name: smart-attendance-backend

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/smart_attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

file:
  upload-dir: ./uploads

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:3000}
